<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="{{themeColorLight}}">
<meta name="theme-color" content="{{themeColor}}">
<title>Switchboard</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Switchboard">
<style>
:root { color-scheme: dark; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: {{themeColor}}; color: #cccccc; font: 14px system-ui, sans-serif; }
main { max-width: 28rem; padding: 24px; text-align: center; }
img { width: 64px; height: 64px; }
h1 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; }
p { margin: 0; color: #9d9d9d; }
p + p { margin-top: 12px; }
a.start { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 2px; background: #0078d4; color: #ffffff; text-decoration: none; }
a.start:hover { background: #026ec1; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
@media (prefers-color-scheme: light) {
  :root { color-scheme: light; }
  body { background: {{themeColorLight}}; color: #3b3b3b; }
  p { color: #3b3b3b; }
}
</style>
</head>
<body>
<main>
<img src="icon-192.png" alt="">
<h1>Switchboard is not running</h1>
<p>This window reconnects by itself once it runs.</p>
<a class="start" href="switchboard:start">Start Switchboard</a>
<p>The button works once <code>hub.js autostart on</code> has run. Otherwise run <code>node ~/.switchboard/hub.js start</code>, or open VS Code or the dock.</p>
</main>
<script src="offline.js"></script>
</body>
</html>
